<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GIT_INVADERS.EXE // GitHub Activity Arcade Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body data-theme="cyan">
  <div class="arcade-cabinet">
    <!-- Top Header Bar with Theme Selector, Controls, Pause and Store -->
    <header class="arcade-header">
      <div class="header-brand">
        <img src="/logo.svg" alt="GIT_INVADERS" class="brand-logo-img" />
        <span class="pulse-led"></span>
        <span class="header-title">GIT_INVADERS.EXE</span>
        <span class="header-badge">v2.5 PRO</span>
      </div>

      <div class="header-controls">
        <!-- In-Combat Session Controls (Visible only during active combat) -->
        <div id="combatControls" class="combat-controls-group" style="display: none;">
          <button id="pauseBtn" class="control-chip control-chip-pause" title="Pause / Resume Game">
            <span class="chip-status-led cyan"></span>
            <span id="pauseBtnText">PAUSE [ESC]</span>
          </button>
          <button id="lobbyBtn" class="control-chip control-chip-abort" title="Abort Mission to Pilot Hangar">
            <span class="chip-status-led amber"></span>
            <span id="lobbyBtnText">HANGAR [◀]</span>
          </button>
        </div>

        <!-- Hardware & Cabinet Controls (Always accessible) -->
        <div class="hardware-controls-group">
          <!-- Theme Select Dropdown -->
          <div class="theme-select-box">
            <select id="themeSelect" class="theme-dropdown" title="Select Visual Theme">
              <option value="cyan" selected>CYBER CYAN</option>
              <option value="matrix">MATRIX PHOSPHOR</option>
              <option value="light">GITHUB LIGHT</option>
              <option value="cyberpunk">CYBERPUNK NEON</option>
              <option value="amber">AMBER CRT</option>
            </select>
          </div>

          <button id="crtToggle" class="control-chip active" title="Toggle CRT Scanlines">
            <span class="chip-status-led cyan"></span>
            <span>CRT FX</span>
          </button>
          <button id="audioToggle" class="control-chip" title="Toggle Audio Synthesizer">
            <span class="chip-status-led green"></span>
            <span id="audioToggleLabel">AUDIO: ON</span>
          </button>
          <button id="langToggleBtn" class="control-chip control-chip-lang" title="Toggle Language (EN / ES)">
            <span id="langToggleText">[ EN | ES ]</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main CRT Monitor Container -->
    <main class="monitor-wrapper">
      <div class="crt-screen">
        <div class="crt-scanline-overlay"></div>
        <div class="crt-bloom-overlay"></div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div id="hudContainer" class="hud-container"></div>

        <!-- Lobby / Pilot Dashboard Overlay -->
        <div id="lobbyOverlay" class="lobby-overlay"></div>

        <!-- Terminal Mission Select Overlay -->
        <div id="terminalOverlay" class="terminal-overlay" style="display: none;"></div>

        <!-- Modals Overlay (Boss Blueprint, Game Over, Victory, Pause, Store) -->
        <div id="modalOverlay" class="modal-overlay" style="display: none;"></div>
      </div>
    </main>

    <!-- Mobile Virtual Controls Pad -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button id="btnLeft" class="touch-btn">◀</button>
        <button id="btnRight" class="touch-btn">▶</button>
      </div>
      <div class="tactical-pad">
        <button id="btnRebase" class="touch-btn touch-tactical">REBASE [Q]</button>
        <button id="btnStash" class="touch-btn touch-tactical">STASH [E]</button>
      </div>
      <div class="action-pad">
        <button id="btnOverdrive" class="touch-btn touch-special">PUSH --FORCE</button>
        <button id="btnFire" class="touch-btn touch-fire">FIRE</button>
      </div>
    </div>

    <!-- Desktop Key Bindings Footer: Interactive Hardware Command Keys -->
    <footer class="arcade-footer" id="desktopControls">
      <button class="arcade-cmd-btn" id="cmdMove" title="Navigate Lateral Thrusters">
        <kbd>A</kbd> <kbd>D</kbd> <span id="lblKeyMove">Move</span>
      </button>
      <button class="arcade-cmd-btn" id="cmdFire" title="Fire Primary Blasters">
        <kbd>SPACE</kbd> <span id="lblKeyFire">Blaster Fire</span>
      </button>
      <button class="arcade-cmd-btn" id="cmdRebase" title="Trigger Git Rebase Chrono Slow-Mo">
        <kbd>Q</kbd> <span id="lblKeyRebase">Git Rebase</span>
      </button>
      <button class="arcade-cmd-btn" id="cmdStash" title="Deploy Stash Deflector Shield">
        <kbd>E</kbd> <span id="lblKeyStash">Git Stash</span>
      </button>
      <button class="arcade-cmd-btn" id="cmdPush" title="Quantum Overdrive Screen Wipe">
        <kbd>SHIFT</kbd> <span id="lblKeyPush">Git Push --Force</span>
      </button>
      <button class="arcade-cmd-btn" id="cmdPause" title="Tactical Pause & Terminal">
        <kbd>ESC</kbd> <span id="lblKeyPause">Pause</span>
      </button>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
