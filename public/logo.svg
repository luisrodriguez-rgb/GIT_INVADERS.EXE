<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Space Void Gradient -->
    <radialGradient id="deepCosmos" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c1a30" />
      <stop offset="45%" stop-color="#050c18" />
      <stop offset="85%" stop-color="#02050c" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Planetary Atmosphere Glow -->
    <linearGradient id="atmoGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- GitHub Octocat Holographic Core -->
    <linearGradient id="octoMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Stealth Hull Shading: Pure White Light Side -->
    <linearGradient id="stealthWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Stealth Hull Shading: Tactical Shadow Side -->
    <linearGradient id="stealthShadow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tactical Visor Sensor Canopy -->
    <linearGradient id="visorPlasma" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Ion Plasma Thruster Plume -->
    <linearGradient id="thrusterPlume" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0)" />
    </linearGradient>

    <!-- Glow Filter for High-Energy Beams -->
    <filter id="neonHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= 1. BACKGROUND & TACTICAL FRAME ================= -->
  <!-- Outer Cosmic Void Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#deepCosmos)" stroke="#00e5ff" stroke-width="3" />

  <!-- Tactical Radar Range Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.18" />

  <!-- Cardinal Reticle Notches (North, South, East, West) -->
  <line x1="256" y1="8" x2="256" y2="22" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <line x1="256" y1="490" x2="256" y2="504" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <line x1="8" y1="256" x2="22" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <line x1="490" y1="256" x2="504" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Diagonal Corner Target Brackets -->
  <path d="M84 96 L72 96 L72 108" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />
  <path d="M428 96 L440 96 L440 108" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />
  <path d="M84 416 L72 416 L72 404" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />
  <path d="M428 416 L440 416 L440 404" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />

  <!-- Tactical Monospace Telemetry Markings -->
  <text x="256" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="2.5" opacity="0.75">SYS.ACT // ORBITAL INTERCEPT</text>
  <text x="256" y="486" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="2.5" opacity="0.65">AIR-TO-SPACE // GIT_INVADERS.EXE</text>

  <!-- ================= 2. CELESTIAL DEEP SPACE & PLANET ARC ================= -->
  <!-- Planetary Atmosphere Limb Arc (Sweeping Horizon) -->
  <path d="M40 330 Q256 260 472 330 L472 490 L40 490 Z" fill="url(#atmoGlow)" opacity="0.5" />
  <path d="M42 330 Q256 260 470 330" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#neonHalo)" opacity="0.8" />
  <path d="M50 332 Q256 262 462 332" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9" />

  <!-- Precision Minimalist Stars (Diamond Glints) -->
  <!-- Star 1 (Top Right) -->
  <polygon points="400,80 402,88 410,90 402,92 400,100 398,92 390,90 398,88" fill="#ffffff" filter="url(#subtleGlow)" />
  <!-- Star 2 (Top Left) -->
  <polygon points="110,95 111.5,100 116.5,101.5 111.5,103 110,108 108.5,103 103.5,101.5 108.5,100" fill="#00e5ff" opacity="0.9" />
  <!-- Star 3 (Mid Right) -->
  <polygon points="440,195 441.5,199 445.5,200.5 441.5,202 440,206 438.5,202 434.5,200.5 438.5,199" fill="#38bdf8" opacity="0.8" />
  <!-- Star 4 (Mid Left) -->
  <polygon points="76,190 77.5,194 81.5,195.5 77.5,197 76,201 74.5,197 70.5,195.5 74.5,194" fill="#ffffff" opacity="0.85" />
  <!-- Stellar Points -->
  <circle cx="160" cy="70" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="340" cy="65" r="1.5" fill="#00e5ff" opacity="0.7" />
  <circle cx="180" cy="190" r="1.2" fill="#ffffff" opacity="0.6" />
  <circle cx="330" cy="200" r="1.2" fill="#38bdf8" opacity="0.6" />

  <!-- ================= 3. GITHUB ORBITAL COMMAND CREST (TARGET APEX) ================= -->
  <!-- Holographic Orbital Ring System -->
  <circle cx="256" cy="138" r="76" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 4" />
  <circle cx="256" cy="138" r="70" fill="#040b18" fill-opacity="0.7" stroke="#00e5ff" stroke-width="2" filter="url(#subtleGlow)" />
  <circle cx="256" cy="138" r="64" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Reticle Cardinal Crossbars around GitHub Station -->
  <line x1="256" y1="56" x2="256" y2="64" stroke="#00e5ff" stroke-width="2" />
  <line x1="256" y1="212" x2="256" y2="220" stroke="#00e5ff" stroke-width="2" />
  <line x1="174" y1="138" x2="182" y2="138" stroke="#00e5ff" stroke-width="2" />
  <line x1="330" y1="138" x2="338" y2="138" stroke="#00e5ff" stroke-width="2" />

  <!-- Target Data Readout -->
  <text x="256" y="60" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="2">TGT://GITHUB.CORE</text>

  <!-- AUTHENTIC OFFICIAL GITHUB OCTOCAT SILHOUETTE (NO WHISKERS, PURE VECTOR MARK) -->
  <!-- Scaled and centered with military precision inside the orbital target reticle -->
  <g transform="translate(256, 138) scale(4.8) translate(-12, -12)">
    <!-- Cyan Neon Aura Glow Layer -->
    <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          fill="none" stroke="#00e5ff" stroke-width="1.8" filter="url(#neonHalo)" opacity="0.6" />
    <!-- Solid Crisp Luminous Metal Fill -->
    <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          fill="url(#octoMetal)" stroke="#ffffff" stroke-width="0.3" />
  </g>

  <!-- Git Commit Telemetry Vector Line (Branch Connecting Ship to GitHub Core) -->
  <line x1="256" y1="216" x2="256" y2="238" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 3" />
  <!-- Commit Node Point -->
  <circle cx="256" cy="227" r="3" fill="#ffffff" stroke="#00e5ff" stroke-width="1.5" />

  <!-- ================= 4. PROPULSION: HIGH-ENERGY ION PLASMA THRUSTERS ================= -->
  <!-- Main Dual Engine Exhausts Blasting Straight Down -->
  <!-- Left Engine Plume -->
  <polygon points="230,422 246,422 242,504 238,508 234,504" fill="url(#thrusterPlume)" filter="url(#neonHalo)" />
  <polygon points="234,422 242,422 240,480 238,485 236,480" fill="#ffffff" />

  <!-- Right Engine Plume -->
  <polygon points="266,422 282,422 278,504 274,508 270,504" fill="url(#thrusterPlume)" filter="url(#neonHalo)" />
  <polygon points="270,422 278,422 276,480 274,485 272,480" fill="#ffffff" />

  <!-- Outer Maneuvering RCS Vents -->
  <polygon points="190,416 198,416 195,456 192,456" fill="url(#thrusterPlume)" opacity="0.6" />
  <polygon points="314,416 322,416 320,456 317,456" fill="url(#thrusterPlume)" opacity="0.6" />

  <!-- ================= 5. THE STEALTH INTERCEPTOR FIGHTER (COMPILER DELTA) ================= -->
  <!-- Heavy Tactical Under-Armor Drop Shadow for Razor Contrast -->
  <polygon points="256,236 272,284 316,334 396,380 404,394 366,410 338,406 326,422 284,424 256,420 228,424 186,422 174,406 146,410 108,394 116,380 196,334 240,284"
           fill="#02050b" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" />

  <!-- === LEFT WING ASSEMBLY (PURE WHITE / SILVER GLEAM) === -->
  <!-- Outer Swept Delta Wing Surface -->
  <polygon points="244,290 196,336 122,382 122,392 168,398 214,374 240,344"
           fill="url(#stealthWhite)" stroke="#00e5ff" stroke-width="1.2" />
  <!-- Wing Armor Tile Accent -->
  <polygon points="230,314 190,348 144,380 170,388 212,364"
           fill="#ffffff" stroke="#38bdf8" stroke-width="0.8" />
  <!-- Inner Intake Shroud (Left) -->
  <polygon points="228,370 178,396 182,414 224,416" fill="#0f172a" stroke="#00e5ff" stroke-width="1" />

  <!-- === RIGHT WING ASSEMBLY (TACTICAL SLATE SHADOW) === -->
  <!-- Outer Swept Delta Wing Surface -->
  <polygon points="268,290 316,336 390,382 390,392 344,398 298,374 272,344"
           fill="url(#stealthShadow)" stroke="#00e5ff" stroke-width="1.2" />
  <!-- Wing Armor Tile Accent -->
  <polygon points="282,314 322,348 368,380 342,388 300,364"
           fill="#475569" stroke="#38bdf8" stroke-width="0.8" />
  <!-- Inner Intake Shroud (Right) -->
  <polygon points="284,370 334,396 330,414 288,416" fill="#0a0f1d" stroke="#00e5ff" stroke-width="1" />

  <!-- === CENTRAL KINETIC FUSELAGE (STEALTH CHISELED SPINE) === -->
  <!-- Main Fuselage Spine Foundation -->
  <polygon points="256,240 274,310 270,416 256,422 242,416 238,310"
           fill="#050a14" stroke="#00e5ff" stroke-width="1.8" />
  <!-- Left Spine Facet (Bright White Highlight) -->
  <polygon points="256,244 256,416 244,412 240,312" fill="url(#stealthWhite)" />
  <!-- Right Spine Facet (Graphite Shadow) -->
  <polygon points="256,244 272,312 268,412 256,416" fill="url(#stealthShadow)" />

  <!-- === COCKPIT CANOPY (DIAMOND SENSOR VISOR) === -->
  <polygon points="256,268 266,298 256,322 246,298" fill="url(#visorPlasma)" stroke="#00ffff" stroke-width="1.5" filter="url(#subtleGlow)" />
  <!-- Visor High-Luminance Laser Glint -->
  <polygon points="256,274 261,296 256,308 251,296" fill="#ffffff" opacity="0.9" />

  <!-- === TWIN STABILIZER FINS (CANTED STEALTH RUDDERS) === -->
  <polygon points="234,352 230,412 224,414 226,360" fill="#ffffff" stroke="#00e5ff" stroke-width="1" />
  <polygon points="278,352 282,412 288,414 286,360" fill="#334155" stroke="#00e5ff" stroke-width="1" />

  <!-- === WINGTIP HIGH-ENERGY RAILGUN CANNONS === -->
  <!-- Left Cannon Barrel -->
  <line x1="120" y1="374" x2="120" y2="396" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="square" />
  <rect x="118" y="368" width="4" height="6" fill="#ffffff" filter="url(#subtleGlow)" />
  <!-- Right Cannon Barrel -->
  <line x1="392" y1="374" x2="392" y2="396" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="square" />
  <rect x="390" y="368" width="4" height="6" fill="#ffffff" filter="url(#subtleGlow)" />

  <!-- Fuselage Tech Marking -->
  <text x="256" y="366" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="1.5">GIT-01</text>
  <line x1="246" y1="374" x2="266" y2="374" stroke="#00e5ff" stroke-width="1.2" />
</svg>
